name: 🛰️ Build APK - Rastreador Polonorte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📗 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removido o cache temporariamente para evitar erro
          # cache: 'npm'

      - name: 📦 Instalar dependências
        run: |
          npm install
          # Gera o package-lock.json na primeira execução
          npm install --package-lock-only

      - name: 🔧 Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: 🔑 Ajustar permissões Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/ACCESS_FINE_LOCATION/a \    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>' $MANIFEST
            sed -i '/FOREGROUND_SERVICE/a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>' $MANIFEST || true
          fi
          echo "✅ Permissões ajustadas"

      - name: 🏗️ Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_OPTS: '-Xmx4096m'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m'

      - name: 📌 Definir versão
        id: version
        run: echo "tag=v$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 🚀 Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Rastreador Polonorte ${{ steps.version.outputs.tag }}"
          body: |
            **Compilado em:** ${{ steps.version.outputs.tag }}
            
            ✅ App atualizado e compatível com sua plataforma
            ✅ Rastreamento em segundo plano
          files: android/app/build/outputs/apk/debug/app-debug.apk
